name: build-dotnet-container-image

# Orchestrator for Volare .NET microservices: framework CI -> containerize ->
# push -> release.
# - Delegates restore/build/test to the shared `build-and-test` composite action
# - On non-PR runs (when push-image is true), delegates the docker build to the
#   generic containerize-image.yml (image.tar workflow artifact), then the push
#   to push-container-image.yml's LOAD mode, tagged with
#   `<csproj-Version>.<github.run_number>` (or just `<github.run_number>` when
#   no version-csproj is provided).
#
# Registry is selectable via the `registry` input:
#   ghcr   (default) → ghcr.io/<owner>/<image>            (GITHUB_TOKEN auth)
#   gitlab           → registry.gitlab.com/<ns>/<image>   (GITLAB_USERNAME/TOKEN)
#   acr              → <acr-name>/<image>          (azure/login OIDC)
#   ecr              → <account>.dkr.ecr.<region>.amazonaws.com/<image> (GitHub OIDC → IAM role)
# Defaults align with GHCR; services deploying to Azure App Service / Functions
# (which pull from ACR via deploy-azure-app-service.yml / deploy-azure-function-app.yml)
# must set `registry: acr` so the build pushes where the deploy pulls.
#
# Tagging: `include-version-tag` (default true) pushes the immutable
# `<Version>.<run_number>` tag; `include-latest-tag` (default false) also pushes
# `:latest`. At least one must be enabled when push-image is true. Producing the
# image lives in containerize-image.yml; tag resolution + registry push live in
# push-container-image.yml. This workflow computes the inputs, gates on
# build-and-test, and drafts the release.
#
# Scope is the container image side only; nupkg publishing belongs to
# build-dotnet-package.yml.
#
# Draft PRs do not trigger this workflow's work — see the job-level `if:` below.
# Callers should add `ready_for_review` to their `pull_request: types:` list so
# the build runs when a draft is flipped to ready:
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]

on:
  workflow_call:
    inputs:
      api-name:
        description: "Optional .NET service name. Today only used as a fallback for image-name. If omitted (and image-name is also empty) the image-name defaults to the caller repo's github.event.repository.name."
        required: false
        type: string
        default: ""
      image-name:
        description: "Image repository name (final path segment). If omitted, derived from api-name or the caller repo's name (github.event.repository.name). Always lowercased before push (Docker registry requirement)."
        required: false
        type: string
        default: ""
      version-csproj:
        description: "Optional path to a .csproj file with a <Version> element used to compute the semver-style image tag (<Version>.<github.run_number>). When empty or the file has no <Version>, the version tag falls back to <github.run_number> alone."
        required: false
        type: string
        default: ""
      solution-path:
        description: "Path to a specific .sln or .csproj to restore/build/test. Empty = let dotnet auto-detect from the working directory (typical case)."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile. Defaults to ./Dockerfile."
        required: false
        type: string
        default: "./Dockerfile"
      dotnet-version:
        description: "Version range passed to actions/setup-dotnet."
        required: false
        type: string
        default: "10.x"
      test-filter:
        description: "Filter expression passed to dotnet test --filter."
        required: false
        type: string
        default: "TestCategory!=IntegrationTest"
      build-configuration:
        description: "MSBuild configuration."
        required: false
        type: string
        default: "Release"
      push-image:
        description: "Whether to build + push the Docker image. Set true on push-to-main, false on PRs."
        required: false
        type: boolean
        default: false
      skip-tests:
        description: "When true, skip dotnet test (still restores/builds). Use on push-to-main where tests already ran on the PR."
        required: false
        type: boolean
        default: false
      registry:
        description: "Target registry provider: ghcr (default) | gitlab | acr | ecr. Selects the login mechanism and the default host/namespace."
        required: false
        type: string
        default: "ghcr"
      registry-host:
        description: "Override the registry hostname. Defaults per provider: ghcr.io / registry.gitlab.com / acr-name."
        required: false
        type: string
        default: ""
      image-namespace:
        description: "Path segment between the host and the image name. Defaults: ghcr → github.repository_owner (lowercased); acr → none; gitlab → must be supplied (e.g. volare-consulting/ncproconstruction)."
        required: false
        type: string
        default: ""
      include-version-tag:
        description: "Push the immutable <Version>.<run_number> tag. Default true."
        required: false
        type: boolean
        default: true
      include-latest-tag:
        description: "Also tag the image :latest. Default false."
        required: false
        type: boolean
        default: false
      create-release:
        description: "Draft a GitHub Release per main-push build. Default true; set false to opt out."
        required: false
        type: boolean
        default: true
      acr-name:
        description: "ACR registry hostname (used only when registry: acr and registry-host is empty). Required when registry is acr (no default)."
        required: false
        type: string
        default: ""
      runner-os:
        description: "GitHub-hosted runner image for the build job. Default ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      OIDC_CLIENT_ID:
        required: false
      OIDC_TENANT_ID:
        required: false
      OIDC_SUBSCRIPTION_ID:
        required: false
      OIDC_AWS_ROLE_ARN:
        required: false
      GITLAB_USERNAME:
        required: false
      GITLAB_TOKEN:
        required: false
    outputs:
      image-tag-version:
        description: "The version tag computed: <csproj-Version>.<run_number> or just <run_number> (empty if push-image was false)."
        value: ${{ jobs.push.outputs.image-tag-version }}
      image-name:
        description: "The lowercased image repository name (final path segment) the image was pushed to."
        value: ${{ jobs.push.outputs.image-name }}
      image-ref:
        description: "The primary full image reference pushed (host/namespace/name:tag) — version tag if present, otherwise :latest."
        value: ${{ jobs.push.outputs.image-ref }}

permissions:
  contents: read
  packages: write   # GHCR push (default registry). Callers pushing to GHCR must also grant packages: write.
  id-token: write   # required for azure/login OIDC on the acr path (no-op otherwise)

# Cancel any in-progress run for the same ref when a newer commit arrives.
# Container builds + registry pushes are expensive; only the latest commit's
# image matters. Mirrors build-dotnet-package.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Skip on draft PRs. Push-to-main and workflow_dispatch have no
    # pull_request payload, so the first clause keeps them running.
    # Caller's `pull_request: types:` must include `ready_for_review`
    # for the build to auto-trigger when a draft is marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner-os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build & test
        uses: Volare-Consulting-Software/.github/.github/actions/build-and-test@main
        with:
          solution-path: ${{ inputs.solution-path }}
          dotnet-version: ${{ inputs.dotnet-version }}
          build-configuration: ${{ inputs.build-configuration }}
          test-filter: ${{ inputs.test-filter }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-tests: ${{ inputs.skip-tests }}

  # Produce the image (generic docker build -> image.tar artifact). Gated on a
  # green build-and-test and only when push-image is true (PRs build+test only,
  # matching the previous behavior where no image work ran on PRs).
  containerize:
    needs: [build-and-test]
    if: ${{ inputs.push-image }}
    uses: ./.github/workflows/containerize-image.yml
    with:
      image-name: ${{ inputs.image-name || inputs.api-name }}
      dockerfile: ${{ inputs.dockerfile }}
      runner-os: ${{ inputs.runner-os }}

  # Push the exported image (LOAD mode). Only this leg knows the registry.
  # Skipped automatically when containerize was skipped (no always()).
  push:
    needs: [containerize]
    uses: ./.github/workflows/push-container-image.yml
    with:
      api-name: ${{ inputs.api-name }}
      image-name: ${{ inputs.image-name }}
      version-csproj: ${{ inputs.version-csproj }}
      image-artifact: ${{ needs.containerize.outputs.image-artifact }}
      registry: ${{ inputs.registry }}
      registry-host: ${{ inputs.registry-host }}
      image-namespace: ${{ inputs.image-namespace }}
      include-version-tag: ${{ inputs.include-version-tag }}
      include-latest-tag: ${{ inputs.include-latest-tag }}
      acr-name: ${{ inputs.acr-name }}
      runner-os: ${{ inputs.runner-os }}
    secrets: inherit

  # Draft a GitHub Release per main-push build. The release is the artifact
  # that operators promote on the Releases page:
  #   draft  → not promoted (no deploy events fire)
  #   prerelease → staging deploy fires (caller's `on: release: prereleased`)
  #   released   → production deploy fires (caller's `on: release: released`)
  # Tag uses the `v` prefix convention (vMAJOR.MINOR.PATCH.RUN) so the release
  # tag and the image version tag have a 1:1 mapping (strip the `v` to get the
  # image tag). Auto-generated notes from PR titles since the previous release;
  # appended footer carries the full image reference for traceability.
  release:
    needs: [push]
    if: ${{ inputs.push-image && inputs.create-release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.push.outputs.image-tag-version }}
      IMAGE_REF: ${{ needs.push.outputs.image-ref }}
    steps:
      - name: Compose release notes
        run: |
          set -euo pipefail
          # Auto-generate the "what changed" body from PR titles since the last
          # release. Falls back to an empty body on the first build of a repo
          # (no prior release to diff against).
          gh api -X POST "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v${TAG}" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > notes.md || echo "" > notes.md
          # Footer: the image reference this release maps to. Operators copy this
          # for kubectl-style ops or the dispatch rollback path.
          {
            echo
            echo "---"
            echo
            echo "**Container image:** \`${IMAGE_REF}\`"
          } >> notes.md

      - name: Create draft release
        run: |
          set -euo pipefail
          gh release create "v${TAG}" \
            --title "v${TAG}" \
            --draft \
            --target "${{ github.sha }}" \
            --notes-file notes.md \
            --repo "${{ github.repository }}"
