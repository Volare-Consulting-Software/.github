name: ef-deploy

# Reusable workflow that applies EF Core migrations to an Azure SQL database when a
# release is published. For each context it generates an idempotent SQL script from
# the released source (offline — no DB connection), uploads it as an artifact for
# audit, then applies it via azure/sql-action. Idempotent scripts are safe to re-run,
# so re-publishing a release is a no-op against an already-migrated database.
#
# Passwordless: the job signs in to Azure with GitHub OIDC (OIDC_* secrets) and
# connects to SQL as that identity (Authentication=Active Directory Default). There is
# no connection string or password to store. The identity needs a contained database
# user with rights to apply migrations, e.g.:
#   CREATE USER [<identity name>] FROM EXTERNAL PROVIDER;
#   ALTER ROLE db_ddladmin ADD MEMBER [<identity name>];
#   ALTER ROLE db_datareader ADD MEMBER [<identity name>];
#   ALTER ROLE db_datawriter ADD MEMBER [<identity name>];
#
# `environment-name` (default production) binds the job to a GitHub Environment for
# gating. The SQL server's firewall must admit the GitHub-hosted runner. The dotnet-ef
# tool version is taken from the project's EF Core package version.

on:
  workflow_call:
    inputs:
      project:
        description: "EF migrations project (directory or .csproj)."
        required: true
        type: string
      startup-project:
        description: "EF startup project (must reference Microsoft.EntityFrameworkCore.Design). Optional — defaults to `project` when the migrations project is self-startup."
        required: false
        type: string
        default: ""
      contexts:
        description: "JSON array of DbContext names to script + apply, e.g. [\"BackOfficeContext\"]."
        required: true
        type: string
      sql-server:
        description: "Azure SQL server host name, e.g. my-server.database.windows.net (a bare server name gets .database.windows.net appended)."
        required: true
        type: string
      database:
        description: "Database to migrate on that server."
        required: true
        type: string
      checkout-ref:
        description: "Git ref to script from — the published release tag, so the released migrations are present."
        required: false
        type: string
        default: ""
      environment-name:
        description: "GitHub Environment to bind the job to (gating / environment secrets)."
        required: false
        type: string
        default: "production"
      dotnet-version:
        description: "Version range passed to actions/setup-dotnet."
        required: false
        type: string
        default: "10.x"
    secrets:
      OIDC_CLIENT_ID:
        description: "Client ID of the identity GitHub signs in as (app registration or user-assigned managed identity with a federated credential). It needs a user on the target database."
        required: true
      OIDC_TENANT_ID:
        required: true
      OIDC_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  ef-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    strategy:
      # One job per context; each generates + applies its own idempotent script.
      matrix:
        context: ${{ fromJSON(inputs.contexts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Configure NuGet (GitHub Packages)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > ci-nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="volare" value="https://nuget.pkg.github.com/Volare-Consulting-Software/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <volare>
                <add key="Username" value="github-actions" />
                <add key="ClearTextPassword" value="__GH_TOKEN__" />
              </volare>
            </packageSourceCredentials>
          </configuration>
          EOF
          sed -i "s|__GH_TOKEN__|${GH_TOKEN}|" ci-nuget.config

      - name: Resolve startup project & EF version
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          STARTUP_INPUT: ${{ inputs.startup-project }}
        run: |
          set -euo pipefail
          startup="${STARTUP_INPUT:-$PROJECT}"
          echo "STARTUP=${startup}" >> "$GITHUB_ENV"
          case "$PROJECT" in
            *.csproj) csproj="$PROJECT" ;;
            *)        csproj=$(ls "$PROJECT"/*.csproj | head -1) ;;
          esac
          ef_ver=$(grep -oP 'Microsoft\.EntityFrameworkCore\.(Design|Tools)"[^>]*Version="\K[^"]+' "$csproj" | head -1)
          if [ -z "$ef_ver" ]; then
            echo "Could not determine EF Core version from $csproj" >&2; exit 1
          fi
          echo "EF_VERSION=${ef_ver}" >> "$GITHUB_ENV"

      - name: Restore & build (Debug, matches ef --no-build)
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$STARTUP" --configfile ci-nuget.config -clp:ErrorsOnly
          dotnet build "$STARTUP" --no-restore -clp:ErrorsOnly

      - name: Install dotnet-ef (version from csproj)
        shell: bash
        run: dotnet tool install --global dotnet-ef --version "$EF_VERSION"

      - name: Generate idempotent script
        shell: bash
        env:
          CONTEXT: ${{ matrix.context }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p scripts
          dotnet ef migrations script --idempotent --no-build \
            --context "$CONTEXT" --project "$PROJECT" --startup-project "$STARTUP" \
            -o "scripts/${CONTEXT}.sql"
          echo "Generated scripts/${CONTEXT}.sql"

      - name: Upload migration script (audit)
        uses: actions/upload-artifact@v4
        with:
          name: ef-migration-script-${{ matrix.context }}
          path: scripts/${{ matrix.context }}.sql
          if-no-files-found: error

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_SUBSCRIPTION_ID }}

      # Passwordless connection string: SqlClient signs in with the Azure login above.
      - name: Build connection string
        shell: bash
        env:
          SQL_SERVER: ${{ inputs.sql-server }}
          DATABASE: ${{ inputs.database }}
        run: |
          set -euo pipefail
          case "$SQL_SERVER" in
            *.*) host="$SQL_SERVER" ;;
            *)   host="${SQL_SERVER}.database.windows.net" ;;
          esac
          echo "SQL_CONNECTION_STRING=Server=tcp:${host},1433;Initial Catalog=${DATABASE};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Default;" >> "$GITHUB_ENV"
          echo "Applying to ${DATABASE} on ${host}"

      - name: Apply idempotent script to database
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ env.SQL_CONNECTION_STRING }}
          path: scripts/${{ matrix.context }}.sql
