name: push-container-image

# Builds and publishes a container image to a registry (ghcr | gitlab | acr | ecr).
# Framework CI lives in the dotnet/node-build-and-test composite actions; caller
# repos compose those with this workflow as jobs. Two modes:
#
#   BUILD   (default)         builds `dockerfile`; pushes <base>.<run_number>
#                             (base from csproj <Version> or package.json
#                             MAJOR.MINOR).
#   PROMOTE (source-tag set)  registry-side retag of an existing image to
#                             dest-tags; leading `v` stripped (vX.Y.Z -> X.Y.Z).
#
# ecr: GitHub OIDC -> IAM role from the OIDC_AWS_ROLE_ARN org secret (callers
# need `id-token: write`); ECR repositories are NOT auto-created on push.

on:
  workflow_call:
    inputs:
      api-name:
        description: "Optional service name. Fallback for image-name. If omitted (and image-name empty) image-name defaults to the caller repo's github.event.repository.name."
        required: false
        type: string
        default: ""
      image-name:
        description: "Image repository name (final path segment). If omitted, derived from api-name or the caller repo's name. Always lowercased before push."
        required: false
        type: string
        default: ""
      version-csproj:
        description: "BUILD mode: optional path to a .csproj with a <Version> element used to compute the version tag (<Version>.<run_number>). Empty / no <Version> → version tag falls back to <run_number>. Ignored in PROMOTE mode."
        required: false
        type: string
        default: ""
      version-package-json:
        description: "BUILD mode: optional path to a package.json whose version's MAJOR.MINOR provides the version-tag base (<MAJ.MIN>.<run_number>). Ignored when version-csproj resolves a base, and in PROMOTE mode."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "BUILD mode: path to the Dockerfile. Defaults to ./Dockerfile."
        required: false
        type: string
        default: "./Dockerfile"
      build-context:
        description: "BUILD mode: Docker build context. Defaults to the repo root."
        required: false
        type: string
        default: "."
      registry:
        description: "Target registry provider: ghcr (default) | gitlab | acr | ecr."
        required: false
        type: string
        default: "ghcr"
      registry-host:
        description: "Override the registry hostname. Defaults per provider: ghcr.io / registry.gitlab.com / acr-name."
        required: false
        type: string
        default: ""
      image-namespace:
        description: "Path segment between host and image name. Defaults: ghcr → repo owner; acr/ecr → none; gitlab → must be supplied."
        required: false
        type: string
        default: ""
      include-version-tag:
        description: "BUILD mode: push the immutable <base>.<run_number> version tag. Default true."
        required: false
        type: boolean
        default: true
      include-latest-tag:
        description: "BUILD mode: also tag the image :latest. Default false. Exception only — the convention is :latest moves via PROMOTE on the released event, never from a main build."
        required: false
        type: boolean
        default: false
      source-tag:
        description: "PROMOTE mode trigger. When set, no build happens; the existing <ref>:<source-tag> image is re-tagged to dest-tags. A leading 'v' is stripped (Release tag vX → image tag X)."
        required: false
        type: string
        default: ""
      dest-tags:
        description: "PROMOTE mode: whitespace/newline-separated destination tags to point at the source image. Defaults to 'latest'."
        required: false
        type: string
        default: "latest"
      acr-name:
        description: "ACR registry hostname (used only when registry: acr and registry-host is empty). Required when registry is acr (no default)."
        required: false
        type: string
        default: ""
      aws-region:
        description: "AWS region of the ECR registry (used only when registry: ecr)."
        required: false
        type: string
        default: "us-east-1"
      runner-os:
        description: "GitHub-hosted runner image. Default ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      OIDC_CLIENT_ID:
        required: false
      OIDC_TENANT_ID:
        required: false
      OIDC_SUBSCRIPTION_ID:
        required: false
      OIDC_AWS_ROLE_ARN:
        required: false
      GITLAB_USERNAME:
        required: false
      GITLAB_TOKEN:
        required: false
    outputs:
      image-tag-version:
        description: "BUILD: <base>.<run_number> (base from csproj <Version> or package.json MAJ.MIN; bare <run_number> when neither resolves). PROMOTE: the source image tag (source-tag with any leading v stripped)."
        value: ${{ jobs.push.outputs.image-tag-version }}
      image-name:
        description: "The lowercased image repository name the image was pushed to."
        value: ${{ jobs.push.outputs.image-name }}
      image-ref:
        description: "Primary full image reference (host/namespace/name:tag). BUILD → version tag if present else :latest. PROMOTE → first dest tag."
        value: ${{ jobs.push.outputs.image-ref }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  push:
    runs-on: ${{ inputs.runner-os }}
    outputs:
      image-tag-version: ${{ steps.image-meta.outputs.tag-version }}
      image-name: ${{ steps.image-meta.outputs.image-name }}
      image-ref: ${{ steps.image-meta.outputs.primary-ref }}
    steps:
      - uses: actions/checkout@v4

      # ECR logs in before metadata: the registry host comes from the login
      # output, keeping the AWS account id out of this public file.
      - name: Configure AWS credentials
        if: ${{ inputs.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to ECR
        if: ${{ inputs.registry == 'ecr' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: image-meta
        env:
          REGISTRY: ${{ inputs.registry }}
          INPUT_REGISTRY_HOST: ${{ inputs.registry-host }}
          INPUT_ACR_NAME: ${{ inputs.acr-name }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_API_NAME: ${{ inputs.api-name }}
          INPUT_NAMESPACE: ${{ inputs.image-namespace }}
          INPUT_VERSION_CSPROJ: ${{ inputs.version-csproj }}
          INPUT_VERSION_PACKAGE_JSON: ${{ inputs.version-package-json }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
          INCLUDE_VERSION_TAG: ${{ inputs.include-version-tag }}
          INCLUDE_LATEST_TAG: ${{ inputs.include-latest-tag }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          DEST_TAGS: ${{ inputs.dest-tags }}
        run: |
          set -euo pipefail

          # Host: per-provider default, overridable via registry-host.
          case "$REGISTRY" in
            ghcr)   default_host="ghcr.io" ;;
            gitlab) default_host="registry.gitlab.com" ;;
            acr)    default_host="${INPUT_ACR_NAME:-}" ;;
            ecr)    default_host="${ECR_REGISTRY:-}" ;;
            *) echo "Unknown registry '$REGISTRY' (expected ghcr|gitlab|acr|ecr)" >&2; exit 1 ;;
          esac
          host="${INPUT_REGISTRY_HOST:-$default_host}"
          if [ -z "$host" ]; then
            case "$REGISTRY" in
              acr) echo "acr-name is required when registry is acr" >&2 ;;
              ecr) echo "ECR login did not produce a registry host (is OIDC_AWS_ROLE_ARN set?)" >&2 ;;
              *)   echo "No registry host resolved" >&2 ;;
            esac
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

          # Namespace: explicit input wins; ghcr defaults to repo owner; others none.
          if [ -n "$INPUT_NAMESPACE" ]; then
            namespace="$INPUT_NAMESPACE"
          elif [ "$REGISTRY" = "ghcr" ]; then
            namespace="$OWNER"
          else
            namespace=""
          fi
          namespace=$(echo "$namespace" | tr '[:upper:]' '[:lower:]')

          # Image name: explicit input -> api-name -> repo name, lowercased.
          if [ -n "$INPUT_IMAGE_NAME" ]; then
            raw_name="$INPUT_IMAGE_NAME"
          elif [ -n "$INPUT_API_NAME" ]; then
            raw_name="$INPUT_API_NAME"
          else
            raw_name="$REPO_NAME"
          fi
          image_name=$(echo "$raw_name" | tr '[:upper:]' '[:lower:]')
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"

          if [ -n "$namespace" ]; then
            ref="${host}/${namespace}/${image_name}"
          else
            ref="${host}/${image_name}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          if [ -n "$SOURCE_TAG" ]; then
            # ---------- PROMOTE ----------
            src="${SOURCE_TAG#v}"
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "tag-version=$src" >> "$GITHUB_OUTPUT"
            echo "source-ref=${ref}:${src}" >> "$GITHUB_OUTPUT"

            dests="${DEST_TAGS:-latest}"
            primary_ref=""
            dest_refs=""
            for d in $dests; do
              [ -z "$d" ] && continue
              dest_refs="${dest_refs}${ref}:${d}"$'\n'
              [ -z "$primary_ref" ] && primary_ref="${ref}:${d}"
            done
            if [ -z "$primary_ref" ]; then
              echo "No dest-tags provided for promote." >&2; exit 1
            fi
            echo "primary-ref=$primary_ref" >> "$GITHUB_OUTPUT"
            {
              echo "dest-refs<<__REFS__"
              printf '%s' "$dest_refs"
              echo "__REFS__"
            } >> "$GITHUB_OUTPUT"
            echo "Promote source: ${ref}:${src}"
            echo "Promote dest tag(s):"
            printf '%s' "$dest_refs"
          else
            # ---------- BUILD ----------
            echo "mode=build" >> "$GITHUB_OUTPUT"

            # Version tag base: csproj <Version>, else package.json MAJOR.MINOR,
            # else none — final tag is <base>.<run_number> or bare <run_number>.
            version=""
            if [ -n "$INPUT_VERSION_CSPROJ" ] && [ -f "$INPUT_VERSION_CSPROJ" ]; then
              base=$(grep -oP '(?<=<Version>)[^<]+(?=</Version>)' "$INPUT_VERSION_CSPROJ" | head -1 | tr -d '[:space:]' || true)
              if [ -n "$base" ]; then
                version="${base}.${RUN_NUMBER}"
              fi
            fi
            if [ -z "$version" ] && [ -n "$INPUT_VERSION_PACKAGE_JSON" ] && [ -f "$INPUT_VERSION_PACKAGE_JSON" ]; then
              base=$(jq -r '.version // empty' "$INPUT_VERSION_PACKAGE_JSON" | cut -d. -f1-2)
              if [ -n "$base" ]; then
                version="${base}.${RUN_NUMBER}"
              fi
            fi
            if [ -z "$version" ]; then
              version="${RUN_NUMBER}"
            fi
            echo "tag-version=$version" >> "$GITHUB_OUTPUT"

            tags=""
            primary_ref=""
            if [ "$INCLUDE_VERSION_TAG" = "true" ]; then
              tags="${ref}:${version}"
              primary_ref="${ref}:${version}"
            fi
            if [ "$INCLUDE_LATEST_TAG" = "true" ]; then
              if [ -n "$tags" ]; then
                tags="${tags}"$'\n'"${ref}:latest"
              else
                tags="${ref}:latest"
              fi
              if [ -z "$primary_ref" ]; then
                primary_ref="${ref}:latest"
              fi
            fi
            if [ -z "$tags" ]; then
              echo "No image tags selected: enable include-version-tag and/or include-latest-tag." >&2
              exit 1
            fi
            echo "primary-ref=$primary_ref" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<__TAGS__"
              echo "$tags"
              echo "__TAGS__"
            } >> "$GITHUB_OUTPUT"
            echo "Image target(s):"
            echo "$tags"
          fi

      - name: Log in to Azure
        if: ${{ inputs.registry == 'acr' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: ${{ inputs.registry == 'acr' }}
        run: az acr login --name ${{ steps.image-meta.outputs.host }}

      - name: Log in to GHCR
        if: ${{ inputs.registry == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image-meta.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitLab Container Registry
        if: ${{ inputs.registry == 'gitlab' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image-meta.outputs.host }}
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      # gha cache export requires the docker-container buildx driver.
      - name: Set up Docker Buildx
        if: ${{ steps.image-meta.outputs.mode == 'build' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: ${{ steps.image-meta.outputs.mode == 'build' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          sbom: false
          # gh_token: BuildKit secret for private GitHub Packages restores;
          # mounted per-RUN, never lands in a layer.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.image-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up crane
        if: ${{ steps.image-meta.outputs.mode == 'promote' }}
        uses: imjasonh/setup-crane@v0.4

      - name: Promote existing image to dest tag(s)
        if: ${{ steps.image-meta.outputs.mode == 'promote' }}
        env:
          SOURCE_REF: ${{ steps.image-meta.outputs.source-ref }}
          DEST_REFS: ${{ steps.image-meta.outputs.dest-refs }}
        run: |
          set -euo pipefail
          # Registry-side retag preserving the manifest byte-for-byte (buildx
          # imagetools wraps single manifests in an index, which Lambda rejects).
          while IFS= read -r dest; do
            [ -z "$dest" ] && continue
            echo "Tagging ${dest} -> ${SOURCE_REF}"
            crane copy "$SOURCE_REF" "$dest"
          done <<< "$DEST_REFS"
