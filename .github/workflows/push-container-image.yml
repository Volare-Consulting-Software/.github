name: push-container-image

# Reusable workflow that publishes a container image to a registry. It has
# three modes, selected by `source-tag` / `image-artifact`:
#
#   BUILD   (source-tag and image-artifact empty)
#                               → builds the image from `dockerfile` and pushes
#                                 the computed tag(s): the immutable
#                                 <Version>.<run_number> version tag and/or
#                                 :latest, per include-version-tag/include-latest-tag.
#   LOAD    (image-artifact set) → does NOT build. Downloads the named workflow
#                                 artifact (containing image.tar, e.g. exported by
#                                 build-node-container-image's export-image-artifact),
#                                 loads it, and re-tags/pushes it to the same
#                                 computed tag(s) as BUILD. The build and push
#                                 jobs stay decoupled: only this workflow knows
#                                 which registry the image lands in.
#   PROMOTE (source-tag set)    → does NOT build. Re-tags the already-pushed
#                                 <ref>:<source-tag> image to each of `dest-tags`
#                                 (default :latest) registry-side via
#                                 `docker buildx imagetools create` (no layer pull).
#                                 The leading `v` on source-tag is stripped so a
#                                 GitHub Release tag (v1.2.3) maps to image tag 1.2.3.
#
# Registry selection, host/namespace/image-name resolution, and per-provider
# login mirror build-dotnet-container-image.yml exactly, so both build and promote share
# one implementation. build-dotnet-container-image.yml delegates its BUILD push here.
#
# ecr notes: auth is GitHub OIDC -> the IAM role in the OIDC_AWS_ROLE_ARN org
# secret (callers need `id-token: write`). Unlike GHCR, ECR does NOT create
# repositories on first push — the repository must already exist, and its name
# must match the resolved image-name.

on:
  workflow_call:
    inputs:
      api-name:
        description: "Optional .NET service name. Fallback for image-name. If omitted (and image-name empty) image-name defaults to the caller repo's github.event.repository.name."
        required: false
        type: string
        default: ""
      image-name:
        description: "Image repository name (final path segment). If omitted, derived from api-name or the caller repo's name. Always lowercased before push."
        required: false
        type: string
        default: ""
      version-csproj:
        description: "BUILD mode: optional path to a .csproj with a <Version> element used to compute the version tag (<Version>.<run_number>). Empty / no <Version> → version tag falls back to <run_number>. Ignored in PROMOTE mode."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "BUILD mode: path to the Dockerfile. Defaults to ./Dockerfile."
        required: false
        type: string
        default: "./Dockerfile"
      build-context:
        description: "BUILD mode: Docker build context. Defaults to the repo root."
        required: false
        type: string
        default: "."
      registry:
        description: "Target registry provider: ghcr (default) | gitlab | acr | ecr."
        required: false
        type: string
        default: "ghcr"
      registry-host:
        description: "Override the registry hostname. Defaults per provider: ghcr.io / registry.gitlab.com / acr-name."
        required: false
        type: string
        default: ""
      image-namespace:
        description: "Path segment between host and image name. Defaults: ghcr → repo owner; acr → none; gitlab → must be supplied."
        required: false
        type: string
        default: ""
      include-version-tag:
        description: "BUILD mode: push the immutable <Version>.<run_number> tag. Default true."
        required: false
        type: boolean
        default: true
      include-latest-tag:
        description: "BUILD mode: also tag the image :latest. Default false."
        required: false
        type: boolean
        default: false
      source-tag:
        description: "PROMOTE mode trigger. When set, no build happens; the existing <ref>:<source-tag> image is re-tagged to dest-tags. A leading 'v' is stripped (Release tag vX → image tag X). Takes precedence over image-artifact."
        required: false
        type: string
        default: ""
      image-artifact:
        description: "LOAD mode trigger. Name of a workflow artifact from an earlier job in the same run, containing image.tar (e.g. build-node-container-image's export-image-artifact). The image is loaded and pushed to the computed tag(s); no build happens."
        required: false
        type: string
        default: ""
      dest-tags:
        description: "PROMOTE mode: whitespace/newline-separated destination tags to point at the source image. Defaults to 'latest'."
        required: false
        type: string
        default: "latest"
      acr-name:
        description: "ACR registry hostname (used only when registry: acr and registry-host is empty). Required when registry is acr (no default)."
        required: false
        type: string
        default: ""
      aws-region:
        description: "AWS region of the ECR registry (used only when registry: ecr)."
        required: false
        type: string
        default: "us-east-1"
      runner-os:
        description: "GitHub-hosted runner image. Default ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      OIDC_CLIENT_ID:
        required: false
      OIDC_TENANT_ID:
        required: false
      OIDC_SUBSCRIPTION_ID:
        required: false
      OIDC_AWS_ROLE_ARN:
        required: false
      GITLAB_USERNAME:
        required: false
      GITLAB_TOKEN:
        required: false
    outputs:
      image-tag-version:
        description: "BUILD: <Version>.<run_number> (or <run_number>). PROMOTE: the source image tag (source-tag with any leading v stripped)."
        value: ${{ jobs.push.outputs.image-tag-version }}
      image-name:
        description: "The lowercased image repository name the image was pushed to."
        value: ${{ jobs.push.outputs.image-name }}
      image-ref:
        description: "Primary full image reference (host/namespace/name:tag). BUILD → version tag if present else :latest. PROMOTE → first dest tag."
        value: ${{ jobs.push.outputs.image-ref }}

permissions:
  contents: read
  packages: write   # GHCR push
  id-token: write   # azure/login (acr) and aws-actions (ecr) OIDC; no-op otherwise

jobs:
  push:
    runs-on: ${{ inputs.runner-os }}
    outputs:
      image-tag-version: ${{ steps.image-meta.outputs.tag-version }}
      image-name: ${{ steps.image-meta.outputs.image-name }}
      image-ref: ${{ steps.image-meta.outputs.primary-ref }}
    steps:
      # Checkout is only needed for BUILD mode (Dockerfile + context). Harmless
      # in PROMOTE mode.
      - uses: actions/checkout@v4

      # ECR login runs BEFORE metadata is computed (unlike the other providers):
      # the registry hostname (<account>.dkr.ecr.<region>.amazonaws.com) is taken
      # from the login action's output, which keeps the AWS account id out of
      # this public file. Auth is GitHub OIDC -> IAM role; no stored AWS keys.
      - name: Configure AWS credentials
        if: ${{ inputs.registry == 'ecr' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to ECR
        if: ${{ inputs.registry == 'ecr' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: image-meta
        env:
          REGISTRY: ${{ inputs.registry }}
          INPUT_REGISTRY_HOST: ${{ inputs.registry-host }}
          INPUT_ACR_NAME: ${{ inputs.acr-name }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_API_NAME: ${{ inputs.api-name }}
          INPUT_NAMESPACE: ${{ inputs.image-namespace }}
          INPUT_VERSION_CSPROJ: ${{ inputs.version-csproj }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
          INCLUDE_VERSION_TAG: ${{ inputs.include-version-tag }}
          INCLUDE_LATEST_TAG: ${{ inputs.include-latest-tag }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          DEST_TAGS: ${{ inputs.dest-tags }}
          IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
        run: |
          set -euo pipefail

          # Registry host: per-provider default, overridable via registry-host.
          case "$REGISTRY" in
            ghcr)   default_host="ghcr.io" ;;
            gitlab) default_host="registry.gitlab.com" ;;
            acr)    default_host="${INPUT_ACR_NAME:?acr-name is required when registry is acr}" ;;
            ecr)    default_host="${ECR_REGISTRY:?ECR login did not produce a registry host (is OIDC_AWS_ROLE_ARN set?)}" ;;
            *) echo "Unknown registry '$REGISTRY' (expected ghcr|gitlab|acr|ecr)" >&2; exit 1 ;;
          esac
          host="${INPUT_REGISTRY_HOST:-$default_host}"
          echo "host=$host" >> "$GITHUB_OUTPUT"

          # Namespace: explicit input wins; ghcr defaults to repo owner; others none.
          if [ -n "$INPUT_NAMESPACE" ]; then
            namespace="$INPUT_NAMESPACE"
          elif [ "$REGISTRY" = "ghcr" ]; then
            namespace="$OWNER"
          else
            namespace=""
          fi
          namespace=$(echo "$namespace" | tr '[:upper:]' '[:lower:]')

          # Image name: explicit input -> api-name -> repo name, lowercased.
          if [ -n "$INPUT_IMAGE_NAME" ]; then
            raw_name="$INPUT_IMAGE_NAME"
          elif [ -n "$INPUT_API_NAME" ]; then
            raw_name="$INPUT_API_NAME"
          else
            raw_name="$REPO_NAME"
          fi
          image_name=$(echo "$raw_name" | tr '[:upper:]' '[:lower:]')
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"

          if [ -n "$namespace" ]; then
            ref="${host}/${namespace}/${image_name}"
          else
            ref="${host}/${image_name}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          if [ -n "$SOURCE_TAG" ]; then
            # ---------- PROMOTE mode ----------
            # The source image already exists; we only add tags pointing at it.
            src="${SOURCE_TAG#v}"
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "tag-version=$src" >> "$GITHUB_OUTPUT"
            echo "source-ref=${ref}:${src}" >> "$GITHUB_OUTPUT"

            dests="${DEST_TAGS:-latest}"
            primary_ref=""
            dest_refs=""
            for d in $dests; do
              [ -z "$d" ] && continue
              dest_refs="${dest_refs}${ref}:${d}"$'\n'
              [ -z "$primary_ref" ] && primary_ref="${ref}:${d}"
            done
            if [ -z "$primary_ref" ]; then
              echo "No dest-tags provided for promote." >&2; exit 1
            fi
            echo "primary-ref=$primary_ref" >> "$GITHUB_OUTPUT"
            {
              echo "dest-refs<<__REFS__"
              printf '%s' "$dest_refs"
              echo "__REFS__"
            } >> "$GITHUB_OUTPUT"
            echo "Promote source: ${ref}:${src}"
            echo "Promote dest tag(s):"
            printf '%s' "$dest_refs"
          else
            # ---------- BUILD / LOAD mode (same tag computation) ----------
            if [ -n "$IMAGE_ARTIFACT" ]; then
              echo "mode=load" >> "$GITHUB_OUTPUT"
            else
              echo "mode=build" >> "$GITHUB_OUTPUT"
            fi

            # Version tag: <csproj Version>.<run_number> or <run_number>.
            version=""
            if [ -n "$INPUT_VERSION_CSPROJ" ] && [ -f "$INPUT_VERSION_CSPROJ" ]; then
              base=$(grep -oP '(?<=<Version>)[^<]+(?=</Version>)' "$INPUT_VERSION_CSPROJ" | head -1 | tr -d '[:space:]' || true)
              if [ -n "$base" ]; then
                version="${base}.${RUN_NUMBER}"
              fi
            fi
            if [ -z "$version" ]; then
              version="${RUN_NUMBER}"
            fi
            echo "tag-version=$version" >> "$GITHUB_OUTPUT"

            tags=""
            primary_ref=""
            if [ "$INCLUDE_VERSION_TAG" = "true" ]; then
              tags="${ref}:${version}"
              primary_ref="${ref}:${version}"
            fi
            if [ "$INCLUDE_LATEST_TAG" = "true" ]; then
              if [ -n "$tags" ]; then
                tags="${tags}"$'\n'"${ref}:latest"
              else
                tags="${ref}:latest"
              fi
              if [ -z "$primary_ref" ]; then
                primary_ref="${ref}:latest"
              fi
            fi
            if [ -z "$tags" ]; then
              echo "No image tags selected: enable include-version-tag and/or include-latest-tag." >&2
              exit 1
            fi
            echo "primary-ref=$primary_ref" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<__TAGS__"
              echo "$tags"
              echo "__TAGS__"
            } >> "$GITHUB_OUTPUT"
            echo "Image target(s):"
            echo "$tags"
          fi

      - name: Log in to Azure
        if: ${{ inputs.registry == 'acr' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: ${{ inputs.registry == 'acr' }}
        run: az acr login --name ${{ steps.image-meta.outputs.host }}

      - name: Log in to GHCR
        if: ${{ inputs.registry == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image-meta.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitLab Container Registry
        if: ${{ inputs.registry == 'gitlab' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image-meta.outputs.host }}
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Download prebuilt image artifact
        if: ${{ steps.image-meta.outputs.mode == 'load' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: /tmp/image-artifact

      - name: Load and push prebuilt image
        if: ${{ steps.image-meta.outputs.mode == 'load' }}
        env:
          TAGS: ${{ steps.image-meta.outputs.tags }}
        run: |
          set -euo pipefail
          # docker load reports the tag baked into the tar by the build job
          # ("Loaded image: <ref>"); that local ref is our retag source.
          src=$(docker load -i /tmp/image-artifact/image.tar | sed -n 's/^Loaded image: //p' | head -1)
          if [ -z "$src" ]; then
            echo "image.tar contained no tagged image" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing ${tag}"
            docker tag "$src" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Build and push image
        if: ${{ steps.image-meta.outputs.mode == 'build' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          # Expose GITHUB_TOKEN as a BuildKit secret so the Dockerfile's
          # `dotnet restore` can authenticate against
          # nuget.pkg.github.com/Volare-Consulting-Software. Mounted only for
          # that RUN step; never lands in an image layer.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.image-meta.outputs.tags }}

      - name: Promote existing image to dest tag(s)
        if: ${{ steps.image-meta.outputs.mode == 'promote' }}
        env:
          SOURCE_REF: ${{ steps.image-meta.outputs.source-ref }}
          DEST_REFS: ${{ steps.image-meta.outputs.dest-refs }}
        run: |
          set -euo pipefail
          # Registry-side retag: imagetools reads the source manifest and writes a
          # new tag pointing at the same digest — no layer pull, preserves multi-arch.
          while IFS= read -r dest; do
            [ -z "$dest" ] && continue
            echo "Tagging ${dest} -> ${SOURCE_REF}"
            docker buildx imagetools create --tag "$dest" "$SOURCE_REF"
          done <<< "$DEST_REFS"
