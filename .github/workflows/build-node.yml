name: build-node

# Orchestrator for Volare Node/Next.js apps: framework CI (the
# node-build-and-test composite action: install -> build -> test) followed by
# delegation to push-container-image.yml, which owns all docker and registry
# work (build, login, tag, push). Mirrors build-dotnet.yml.
#
# Lives in the PUBLIC Volare-Consulting-Software/.github repo so any repo in
# the org (public or private) can call it. Self-contained — no dependency on
# the private Volare.Build repo.
#
# Only the test job here is node-specific; this file contains no docker or
# registry steps. On PR runs (push-image false) the image job still runs as a
# verification build — the Dockerfile must build — but nothing is tagged,
# logged in to, or pushed.
#
# Draft PRs are skipped (see the job-level `if:`). Callers should add
# `ready_for_review` to their `pull_request: types:` so the build runs when a
# draft is marked ready.
#
# Example caller (.github/workflows/build-push.yml in the app repo):
#   on:
#     push: { branches: [main] }
#     pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
#   jobs:
#     build-and-push:
#       uses: Volare-Consulting-Software/.github/.github/workflows/build-node.yml@main
#       permissions: { contents: read, packages: write, id-token: write }
#       secrets: inherit
#       with:
#         registry: ecr                  # or ghcr | gitlab | acr
#         image-name: my-ecr-repo-name   # for ecr: must match an EXISTING repository
#         push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

on:
  workflow_call:
    inputs:
      node-version:
        description: "Version range passed to actions/setup-node."
        required: false
        type: string
        default: "20"
      install-command:
        description: "Dependency install command. Defaults to a clean, lockfile-faithful install."
        required: false
        type: string
        default: "npm ci"
      build-command:
        description: "Build command run in the test job to verify the app compiles."
        required: false
        type: string
        default: "npm run build"
      test-command:
        description: "Test command. Skipped entirely when `skip-tests` is true."
        required: false
        type: string
        default: "npm test"
      skip-tests:
        description: "When true, skip the build+test job (only the image job runs). Use sparingly."
        required: false
        type: boolean
        default: false
      image-name:
        description: "Image repository name (final path segment). If omitted, derived from the caller repo's name. Always lowercased before push."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile relative to the repo root."
        required: false
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context path."
        required: false
        type: string
        default: "."
      push-image:
        description: "Whether to push the image. Set true on push-to-main; false on PRs (the image still builds to verify the Dockerfile, but no push)."
        required: false
        type: boolean
        default: false
      registry:
        description: "Target registry provider: ghcr (default) | gitlab | acr | ecr."
        required: false
        type: string
        default: "ghcr"
      registry-host:
        description: "Override the registry hostname. Defaults per provider: ghcr.io / registry.gitlab.com / acr-name."
        required: false
        type: string
        default: ""
      image-namespace:
        description: "Path segment between host and image name. Defaults: ghcr → repo owner; acr/ecr → none; gitlab → must be supplied."
        required: false
        type: string
        default: ""
      include-version-tag:
        description: "Push the immutable <run_number> version tag. Default true."
        required: false
        type: boolean
        default: true
      include-latest-tag:
        description: "Also tag the image :latest. Default false."
        required: false
        type: boolean
        default: false
      acr-name:
        description: "ACR registry hostname (used only when registry: acr and registry-host is empty). Required when registry is acr (no default)."
        required: false
        type: string
        default: ""
      aws-region:
        description: "AWS region of the ECR registry (used only when registry: ecr)."
        required: false
        type: string
        default: "us-east-1"
      runner-os:
        description: "GitHub-hosted runner image. Default ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      OIDC_AWS_ROLE_ARN:
        description: "IAM role ARN assumed via GitHub OIDC for ECR pushes. Required when registry is ecr and push-image is true."
        required: false
      GITLAB_USERNAME:
        required: false
      GITLAB_TOKEN:
        required: false
    outputs:
      image-tag-version:
        description: "The version tag pushed: <run_number> (empty when push-image was false)."
        value: ${{ jobs.image.outputs.image-tag-version }}
      image-name:
        description: "The lowercased image repository name the image was pushed to."
        value: ${{ jobs.image.outputs.image-name }}
      image-ref:
        description: "Primary full image reference pushed (host/namespace/name:tag). Empty when push-image was false."
        value: ${{ jobs.image.outputs.image-ref }}

# Container builds are expensive; only the latest commit on a ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- build + test (the node-specific part) -------------------------------
  test:
    # Skip on draft PRs and when the caller opts out.
    if: ${{ inputs.skip-tests != true && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ${{ inputs.runner-os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Build & test
        uses: Volare-Consulting-Software/.github/.github/actions/node-build-and-test@main
        with:
          node-version: ${{ inputs.node-version }}
          install-command: ${{ inputs.install-command }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}

  # ---- containerize + push (delegated; all docker/registry work) -----------
  image:
    # Run after tests, but still run when tests were skipped (the `if` keeps the
    # image build alive even if `test` was skipped, via always() + result
    # check). Draft PRs are skipped here too.
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    uses: ./.github/workflows/push-container-image.yml
    with:
      image-name: ${{ inputs.image-name }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      push-image: ${{ inputs.push-image }}
      registry: ${{ inputs.registry }}
      registry-host: ${{ inputs.registry-host }}
      image-namespace: ${{ inputs.image-namespace }}
      include-version-tag: ${{ inputs.include-version-tag }}
      include-latest-tag: ${{ inputs.include-latest-tag }}
      acr-name: ${{ inputs.acr-name }}
      aws-region: ${{ inputs.aws-region }}
      runner-os: ${{ inputs.runner-os }}
    secrets: inherit
