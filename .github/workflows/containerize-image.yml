name: containerize-image

# Generic containerize step: docker build from a Dockerfile → export the image
# as a workflow artifact (image.tar) tagged with a registry-free local ref.
#
# This workflow owns exactly one concern: PRODUCING an image. Framework CI
# (build-node-container-image's test job, build-dotnet-container-image's
# build-and-test) runs before it; push-container-image.yml's LOAD mode
# downloads the artifact and owns DISTRIBUTING the image (provider, host,
# name, tags). Nothing here knows registries exist — the Dockerfile carries
# all framework specifics, so this file stays framework-agnostic too.
#
# Auth: the caller run's GITHUB_TOKEN is exposed to the Docker build as a
# BuildKit secret named `gh_token`, so a Dockerfile that installs private
# @volare-consulting-software packages (npm.pkg.github.com or
# nuget.pkg.github.com) can authenticate; it never lands in an image layer.
# Harmless when unused.
#
# Typically called as a job inside an orchestrator workflow, not directly:
#   containerize:
#     needs: test
#     uses: Volare-Consulting-Software/.github/.github/workflows/containerize-image.yml@main
#     with: { image-artifact: container-image }

on:
  workflow_call:
    inputs:
      image-name:
        description: "Name used in the local tag inside the exported tar. If omitted, derived from the caller repo's github.repository. Always lowercased. The registry-facing name is chosen by the downstream push workflow, not here."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile relative to the repo root."
        required: false
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context path."
        required: false
        type: string
        default: "."
      image-artifact:
        description: "Name of the workflow artifact the image tar is uploaded under. Feed the same name to push-container-image's image-artifact input."
        required: false
        type: string
        default: "container-image"
      runner-os:
        description: "GitHub-hosted runner image. Default ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
    outputs:
      image-artifact:
        description: "Name of the uploaded workflow artifact containing image.tar."
        value: ${{ jobs.containerize.outputs.image-artifact }}
      exported-image-ref:
        description: "Local image reference the tar's image is tagged with."
        value: ${{ jobs.containerize.outputs.exported-image-ref }}
      image-name:
        description: "The lowercased image name used in the local ref."
        value: ${{ jobs.containerize.outputs.image-name }}

permissions:
  contents: read
  packages: read

jobs:
  containerize:
    runs-on: ${{ inputs.runner-os }}
    outputs:
      image-artifact: ${{ steps.meta.outputs.artifact-name }}
      exported-image-ref: ${{ steps.meta.outputs.local-ref }}
      image-name: ${{ steps.meta.outputs.image-name-lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve local image ref
        id: meta
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          ARTIFACT_NAME: ${{ inputs.image-artifact }}
        run: |
          # Docker requires the path component lowercase.
          if [ -n "$INPUT_IMAGE_NAME" ]; then
            raw="$INPUT_IMAGE_NAME"
          else
            raw="${{ github.repository }}"
          fi
          lower=$(echo "$raw" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image-name-lower=$lower" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          # Registry-free on purpose: the downstream push workflow decides
          # where the image actually goes.
          echo "local-ref=local/${lower}:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Exporting local/${lower}:${short_sha} as artifact '${ARTIFACT_NAME}'"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ steps.meta.outputs.local-ref }}
          # Write the image to a tar instead of any registry or daemon.
          outputs: type=docker,dest=/tmp/image.tar
          # Expose GITHUB_TOKEN to the build so a Dockerfile installing private
          # @volare-consulting-software packages can authenticate. Mounted only
          # for the RUN that uses it; never persisted in a layer.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: /tmp/image.tar
          if-no-files-found: error
          # The artifact is a handoff to the push job in the same run, not an
          # archive — keep retention minimal.
          retention-days: 1
